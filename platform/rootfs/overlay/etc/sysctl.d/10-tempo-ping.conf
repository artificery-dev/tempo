# Let every user ping without privilege, through an ICMP datagram socket.
#
# Debian's iputils-ping relies on a cap_net_raw file capability that its
# postinst sets on /bin/ping (never setuid), and drops systemd's own
# sysctl.d/50-default.conf that would open this range. On this device that
# capability does not work: the kernel the image boots today has no
# CONFIG_EXT4_FS_SECURITY, so the security.capability xattr the build wrote
# into the image is invisible to it (setcap on the device says "Operation not
# supported"), and ping as the tempo user fails with "socket: Operation not
# permitted". The datagram path needs no capability and no xattr, only this
# range; upstream systemd ships exactly this value. Kept even once the kernel
# grows the xattr handler, so ping never again depends on a file attribute
# surviving the qemu chroot, a copy, or a kernel option.
net.ipv4.ping_group_range = 0 2147483647
