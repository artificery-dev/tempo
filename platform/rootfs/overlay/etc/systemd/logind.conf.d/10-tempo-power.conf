# The only button wired to logind is the power key. A single tap must NOT shut
# the device down (far too easy to hit). Both presses are ignored:
#  - short press: freed for the Tempo UI's power menu (logind releases its
#    exclusive grab when HandlePowerKey=ignore).
#  - long press: also the UI's; it opens the power dialog, and power-off goes
#    through tempod to systemctl. The MT6323 poweroff handler
#    (CONFIG_POWER_RESET_MT6323) does the final cut, so nothing here needs
#    logind's own long-press action.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
