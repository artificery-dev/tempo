# The only button wired to logind is the power key. A single tap must NOT shut
# the device down (far too easy to hit). Both presses are ignored for now:
#  - short press: freed for the Tempo UI's power menu (logind releases its
#    exclusive grab when HandlePowerKey=ignore).
#  - long press: would poweroff, but that needs the MT6323 PMIC poweroff
#    handler in the kernel; without it systemd hangs at the final step.
#    Revisit once CONFIG_POWER_RESET_MT6323 is proven on-device.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
