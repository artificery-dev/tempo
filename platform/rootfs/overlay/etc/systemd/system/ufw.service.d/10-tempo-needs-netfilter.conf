# The kernel this image boots today has no netfilter compiled in (see
# platform/kernel/config/y2.config), so ufw cannot load a single rule and would fail
# on every boot. Skip cleanly instead: the rule set is fully staged by the rootfs
# build, and the firewall comes up on its own the first time the kernel is
# booted with nf_tables. /proc/net/netfilter exists exactly when
# CONFIG_NETFILTER does.
[Unit]
ConditionPathIsDirectory=/proc/net/netfilter
