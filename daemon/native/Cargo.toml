[package]
name = "tempod"
description = "The Tempo device and service daemon: metrics store, and the privileged control surface the frontend drives"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "tempod_native"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "tempod"
path = "src/main.rs"

[dependencies]
alsa.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha-crypt = "0.5"
