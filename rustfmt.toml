edition = "2024"
max_width = 100
newline_style = "Unix"

use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true

# --- nightly-only below this line ---
# Your default toolchain is nightly, so these apply. On stable, rustfmt prints
# a "can't set unstable option" warning per key and formats without them.
style_edition = "2024"
group_imports = "StdExternalCrate"
imports_granularity = "Crate"
wrap_comments = true
comment_width = 80
format_code_in_doc_comments = true
